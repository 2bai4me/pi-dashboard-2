<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Hintergrund: dunkler Gradient (Hermes-Style) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#1c2333"/>
    </linearGradient>
    <linearGradient id="piGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Square Background -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- Inner Border (accent) -->
  <rect x="20" y="20" width="216" height="216" rx="40" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Subtle grid lines (dashboard feel) -->
  <g opacity="0.15" stroke="#58a6ff" stroke-width="1">
    <line x1="20" y1="80" x2="236" y2="80"/>
    <line x1="20" y1="140" x2="236" y2="140"/>
    <line x1="20" y1="200" x2="236" y2="200"/>
  </g>

  <!-- "π" Symbol (groß, mittig) -->
  <g filter="url(#glow)">
    <text x="128" y="160"
          font-family="Inter, Segoe UI, sans-serif"
          font-size="160"
          font-weight="700"
          text-anchor="middle"
          fill="url(#piGrad)"
          font-style="italic">π</text>
  </g>

  <!-- "2.0" Badge oben rechts -->
  <g>
    <rect x="160" y="28" width="68" height="28" rx="14" fill="url(#accent)"/>
    <text x="194" y="48"
          font-family="Inter, Segoe UI, sans-serif"
          font-size="18"
          font-weight="700"
          text-anchor="middle"
          fill="#0e1217">2.0</text>
  </g>

  <!-- MiniMax M3 Active Pulse dot unten links -->
  <g>
    <circle cx="32" cy="32" r="6" fill="#d29922" opacity="0.9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- "DASHBOARD" Label unten -->
  <text x="128" y="222"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="14"
        font-weight="600"
        text-anchor="middle"
        fill="#8b949e"
        letter-spacing="2">DASHBOARD</text>
</svg>
